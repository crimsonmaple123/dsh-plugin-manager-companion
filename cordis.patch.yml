# dsh-plugin-manager-companion-cmaple: 官方插件管理器的伴生补强。
#
# 行 id 用包名，绝不用 'plugin-manager'——官方 dsh-base 已插入同名行
# （packages/bundle/base/cordis.patch.yml 的 `plugin-manager` 与
# `tool-plugin-manager`），patch 是数组追加语义，同 id 不覆盖而是并存，
# loader 会抛 duplicate loader entry id 让整个 profile 起不来。
# 0.2.1-rc.3 的官方行集实测与本行 id 无冲突。
#
# 0.2.1 起配置按**行 id** 寻址（官方 settings.describe().ns = entry.options.id，
# 客户端 configForms.get(id) 同键）。src/settings.ts 的 SETTINGS_ENTRY_ID 与
# 这里、以及 package.json 的 name 三处必须逐字一致。
- insert:
    - id: dsh-plugin-manager-companion-cmaple
      name: 'dsh-plugin-manager-companion-cmaple'
